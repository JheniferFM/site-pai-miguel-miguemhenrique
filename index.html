<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais - Pai Alisson | Cruzeiro & Mortal Kombat Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --cruzeiro-blue: #0033a0;
            --cruzeiro-dark: #001a50;
            --cruzeiro-gold: #ffc72c;
            --glow-blue: #00d4ff;
            --text-light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #050b14 url('cruzeiro-esporte-clube-brazil-soccer-soccer-clubs-wallpaper-preview.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Overlay para legibilidade */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 26, 80, 0.65) 0%, rgba(5, 11, 20, 0.90) 100%);
            z-index: 0;
        }

        /* Canvas das Estrelas Flutuantes */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-top: 20px;
            margin-bottom: 25px;
            animation: fadeInDown 1.2s ease-out;
        }

        .mk-banner {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.85rem;
            color: var(--cruzeiro-gold);
            text-shadow: 0 0 10px rgba(255, 199, 44, 0.8), 2px 2px #000;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--cruzeiro-gold);
            display: inline-block;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, #a2c4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1e3ff;
            font-weight: 600;
            text-shadow: 1px 1px 4px #000;
        }

        .stars-badge {
            color: var(--cruzeiro-gold);
            font-size: 1.3rem;
            margin: 10px 0;
            filter: drop-shadow(0 0 8px rgba(255, 199, 44, 0.9));
        }

        /* Player de Áudio */
        .audio-control-card {
            background: rgba(0, 26, 80, 0.8);
            border: 2px solid var(--cruzeiro-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 12px 25px;
            margin: 15px 0 30px 0;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulseGlow 2s infinite alternate;
        }

        .audio-control-card:hover {
            transform: scale(1.05);
            border-color: var(--cruzeiro-gold);
            box-shadow: 0 0 25px rgba(255, 199, 44, 0.6);
        }

        .play-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cruzeiro-gold), #ff9100);
            border: none;
            color: #000;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 199, 44, 0.8);
        }

        .audio-info { text-align: left; }
        .audio-title { font-size: 0.95rem; font-weight: 800; color: #fff; }
        .audio-status { font-size: 0.75rem; color: var(--glow-blue); font-weight: 600; text-transform: uppercase; }

        /* Card da Foto estilo Kombat Card */
        .profile-section { margin: 10px 0 40px 0; }

        .kombat-card {
            position: relative;
            width: 280px;
            height: 350px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(0, 51, 160, 0.9), rgba(0, 10, 30, 0.95));
            border: 3px solid var(--cruzeiro-gold);
            box-shadow: 0 0 30px rgba(0, 51, 160, 0.8), 0 0 15px rgba(255, 199, 44, 0.5);
            padding: 12px;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            overflow: hidden;
        }

        .kombat-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.9), 0 0 25px rgba(255, 199, 44, 0.8);
        }

        .kombat-card-header {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            color: var(--cruzeiro-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .photo-wrapper {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .kombat-card:hover .photo-wrapper img { transform: scale(1.1); }

        .click-hint {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--glow-blue);
            text-transform: uppercase;
            animation: bounce 1.5s infinite;
        }

        /* Modal com a Mensagem */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 18, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: linear-gradient(135deg, #001a50, #000c28);
            border: 3px solid var(--cruzeiro-gold);
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.6);
            transform: scale(0.7);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .mk-victory-title {
            font-family: 'Press Start 2P', cursive;
            color: var(--cruzeiro-gold);
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 199, 44, 0.8);
        }

        .modal-message {
            font-size: 1.35rem;
            line-height: 1.7;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 25px;
        }

        .close-btn {
            background: linear-gradient(135deg, var(--cruzeiro-blue), var(--glow-blue));
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .close-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, var(--cruzeiro-gold), #ff9100);
            color: #000;
        }

        footer {
            position: relative;
            z-index: 2;
            padding: 15px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
            100% { box-shadow: 0 0 25px rgba(0, 212, 255, 0.8), 0 0 10px rgba(255, 199, 44, 0.5); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="container">
        <header>
            <div class="mk-banner"><i class="fa-solid fa-gamepad"></i> MORTAL KOMBAT: PAI EDITION</div>
            <h1 class="title">Feliz Dia dos Pais!</h1>
            <div class="stars-badge">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>
            <p class="subtitle">Para o maior guerreiro e cruzeirense do mundo: <strong>Pai Alisson</strong></p>
        </header>


    <div class="modal-overlay" id="messageModal">
        <div class="modal-box">
            <div class="mk-victory-title">💙 FLAWLESS VICTORY! 💙</div>
            <p class="modal-message">
                Pai voce é meu exemplo,meu porto seguro,sempre comigo e principal mente meu pai te amo muito❤️.
            </p>
            <button class="close-btn" id="closeModalBtn">
                <i class="fa-solid fa-heart"></i> Te amo, Pai!
            </button>
        </div>
    </div>

    <footer>
        <p>Feito com amor para o melhor Pai do Mundo • Cruzeiro Esporte Clube 💙</p>
    </footer>

    <script>
        const photoCard = document.getElementById('photoCard');
        const messageModal = document.getElementById('messageModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const audioToggle = document.getElementById('audioToggle');
        const bgMusic = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const audioStatus = document.getElementById('audioStatus');

        photoCard.addEventListener('click', () => {
            messageModal.classList.add('active');
            if (bgMusic.paused) {
                toggleAudio();
            }
        });

        closeModalBtn.addEventListener('click', () => {
            messageModal.classList.remove('active');
        });

        messageModal.addEventListener('click', (e) => {
            if (e.target === messageModal) {
                messageModal.classList.remove('active');
            }
        });

        function toggleAudio() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause';
                    audioStatus.textContent = 'Tocando: Alisson de Azul 🎶';
                    audioStatus.style.color = '#ffc72c';
                }).catch(err => console.log('Erro ao tocar áudio:', err));
            } else {
                bgMusic.pause();
                playIcon.className = 'fa-solid fa-play';
                audioStatus.textContent = 'Pausado • Clique para ouvir';
                audioStatus.style.color = '#00d4ff';
            }
        }

        audioToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAudio();
        });

        // Estrelas animadas do Cruzeiro
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class FloatingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.pulse = Math.random() * 0.02;
            }
            update() {
                this.y -= this.speed;
                this.opacity += Math.sin(Date.now() * this.pulse) * 0.01;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, this.opacity))})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00d4ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const stars = Array.from({ length: 60 }, () => new FloatingStar());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
